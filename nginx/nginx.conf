events {}

http {
    # Cấu hình Proxy cho Backend (Python/FastAPI)
    upstream backend_server {
        server backend:8000;
    }

    # Cấu hình Proxy cho React Frontend (Vite)
    upstream react_frontend_server {
        server frontend-react:5173;
    }

    # Cấu hình Proxy cho Streamlit (Frontend cũ)
    upstream legacy_frontend_server {
        server frontend:8501;
    }

    server {
        listen 80;
        server_name localhost;

        # --- Cấu hình API (Backend) ---
        location /api/ {
            proxy_pass http://backend_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Giao diện React mới (cổng 80) ---
        location / {
            proxy_pass http://react_frontend_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hỗ trợ Hot Module Replacement (Vite WebSocket)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}